<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kampala Community Clinic | Care Operations</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="shell">
<header class="topbar"><div class="identity"><div class="logo" aria-hidden="true">+</div><div><h1>Kampala Community Clinic</h1><p>Patient care and operations <span class="dot">•</span> MongoDB</p></div></div><div class="top-right"><span class="demo-tag">ACADEMIC PROTOTYPE</span><span id="userBadge" class="user-badge" hidden></span><button id="logoutBtn" class="secondary" hidden>Sign out</button></div></header>
<p id="dashboardError" class="alert error" role="alert" hidden></p>
<div id="workspace" hidden><nav id="tabs" class="tabs" aria-label="Clinic modules"></nav><main>
<div id="dashboard" hidden></div><section id="recordsSection" hidden><div class="page-title"><div><h2 id="moduleTitle">Patients</h2><p id="moduleHint">Manage clinic records</p></div><div class="toolbar"><input id="search" type="search" aria-label="Search current module" placeholder="Search records..."><button id="addBtn" class="primary">+ Add new</button></div></div><div id="message" class="alert" role="status" hidden></div><div class="table-wrap"><table id="table"></table></div><p id="empty" class="empty" hidden>No matching records.</p></section>
</main></div>
<footer>Coursework prototype with fictional data only. Not certified or suitable for live patient care.</footer>
</div>
<dialog id="formDialog"><form id="form" novalidate><div class="modal-heading"><div><div class="eyebrow">CLINIC RECORD</div><h2 id="formTitle"></h2></div><button type="button" id="cancelBtn" class="icon-btn" aria-label="Close">×</button></div><div id="formFields" class="form-grid"></div><div id="formError" class="alert error" role="alert" hidden></div><div class="modal-actions"><button type="button" id="cancelFormBtn" class="secondary">Cancel</button><button type="submit" class="primary">Save changes</button></div></form></dialog>
<dialog id="historyDialog"><div class="modal-heading"><h2>Patient care history</h2><button type="button" id="closeHistory" class="icon-btn" aria-label="Close">×</button></div><div id="historyBody"></div></dialog>
<script src="/app.js" defer></script>
</body></html>
